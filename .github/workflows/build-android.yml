name: Test Environment & Packages

on:
  push:
    branches: [ main ]

jobs:
  test-env:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installazione dipendenze di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Installazione e verifica pacchetti
        run: |
          pip install --upgrade pip
          pip install --user cython==0.29.33 buildozer
          export PATH=$PATH:~/.local/bin
          echo "--- VERIFICA CORRETTA INSTALLAZIONE ---"
          python3 --version
          cython --version
          buildozer --version
