name: Build APK Android

# Fa partire la compilazione ogni volta che carichi (push) codice sul
# ramo "main", oppure manualmente dal pulsante "Run workflow" nella
# scheda Actions di GitHub.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Compila APK con Buildozer
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Compila con Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          # Cartella dove si trova il file buildozer.spec.
          # "." significa "nella radice del repository".
          workdir: .
          buildozer_version: stable

      - name: Carica l'APK come risultato scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: apk-compilato
          path: ${{ steps.buildozer.outputs.filename }}
