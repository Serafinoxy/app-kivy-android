name: Test Installazione Pacchetti

on:
  push:
    branches: [ main ]

jobs:
  test-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installazione dipendenze di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Installazione Buildozer e Cython
        run: |
          pip install --upgrade pip
          pip install --user cython==0.29.33 buildozer

      - name: Conferma completamento
        run: |
          echo "Tutti i pacchetti sono stati installati correttamente!"
